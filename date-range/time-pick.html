<div class="datewrap">
  <div class="dfield" [class.on]="!!value()">
    <span class="calmark" aria-hidden="true"><app-icon name="clock" /></span>
    <button
      class="pill single time"
      type="button"
      [class.set]="!!value()"
      [class.live]="open()"
      [disabled]="isDisabled()"
      [attr.aria-label]="label() || emptyWords()"
      [attr.aria-haspopup]="'dialog'"
      [attr.aria-expanded]="open()"
      (click)="openPanel()"
    >
      <span class="ptxt">
        @if (value(); as picked) {
          <bdi dir="ltr">{{ picked }}</bdi>
        } @else {
          {{ emptyWords() }}
        }
      </span>
      <span class="chev"><app-icon name="chev" /></span>
    </button>
  </div>

  @if (open()) {
    <div class="calscrim" [class.sheet]="frame() === 'sheet'" (pointerdown)="close()"></div>
    <div
      #cal
      class="cal open timecal"
      [class.sheet]="frame() === 'sheet'"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="label() || emptyWords()"
      tabindex="-1"
      (keydown.escape)="close()"
    >
      @if (frame() === 'sheet') {
        <div class="grip" aria-hidden="true"></div>
      }
      <div class="calhead">
        {{ label() || emptyWords() }}
        <button class="x" type="button" [attr.aria-label]="i18n.t('cal.close')" (click)="close()">
          <app-icon name="x" />
        </button>
      </div>

      <div class="presets">
        <button type="button" (click)="pickNow()">{{ i18n.t('cal.now') }}</button>
      </div>

      <!-- A clock reads left to right in both languages: hours, then minutes.
           The wheels mirror nothing; only the panel around them does. -->
      <div class="wheels" dir="ltr" [style.--wheel-row.px]="rowPx">
        <div class="wheel">
          <div class="wheel__win" aria-hidden="true"></div>
          <div
            #hourWheel
            class="wheel__col"
            role="listbox"
            tabindex="0"
            [attr.aria-label]="i18n.t('cal.hour')"
            [attr.aria-activedescendant]="hour() ? id + '-h-' + hour() : null"
            (scroll)="onWheelScroll('h', $event.target)"
            (keydown)="onWheelKey('h', $event)"
          >
            @for (h of hours; track h) {
              <div
                class="wheel__row"
                role="option"
                [id]="id + '-h-' + h"
                [class.on]="hour() === h"
                [class.dead]="hourDead(h)"
                [attr.aria-selected]="hour() === h"
                [attr.aria-disabled]="hourDead(h)"
                (click)="setPart('h', h)"
              >
                {{ h }}
              </div>
            }
          </div>
        </div>
        <div class="wheel">
          <div class="wheel__win" aria-hidden="true"></div>
          <div
            #minuteWheel
            class="wheel__col"
            role="listbox"
            tabindex="0"
            [attr.aria-label]="i18n.t('cal.minute')"
            [attr.aria-activedescendant]="minute() ? id + '-m-' + minute() : null"
            (scroll)="onWheelScroll('m', $event.target)"
            (keydown)="onWheelKey('m', $event)"
          >
            @for (m of minutes(); track m) {
              <div
                class="wheel__row"
                role="option"
                [id]="id + '-m-' + m"
                [class.on]="minute() === m"
                [class.dead]="minuteDead(m)"
                [attr.aria-selected]="minute() === m"
                [attr.aria-disabled]="minuteDead(m)"
                (click)="setPart('m', m)"
              >
                {{ m }}
              </div>
            }
          </div>
        </div>
      </div>

      <div class="calfoot">
        <span class="rng">
          <bdi dir="ltr">{{
            hour() || minute() ? (hour() ?? '--') + ':' + (minute() ?? '--') : i18n.t('cal.noTime')
          }}</bdi>
        </span>
        @if (clearable()) {
          <button class="btn sec" type="button" (click)="clear()">{{ i18n.t('cal.clear') }}</button>
        }
        <button class="btn pri" type="button" (click)="done()">{{ i18n.t('cal.done') }}</button>
      </div>
    </div>
  }
</div>
