<div class="sw-head">
  <b>{{ words().title }}</b>
  <span>{{ words().what }}</span>
</div>

@if (failed()) {
  <p class="msg bad show" role="alert" data-test="sw-failed">{{ words().failed }}</p>
} @else if (answer() === null) {
  <p class="sw-note">{{ words().loading }}</p>
} @else {
  <ul class="sw-list">
    @for (row of rows(); track row.module) {
      <li class="sw-row">
        <button type="button" class="sw-go" data-test="sw-module" (click)="chose.emit(row)">
          <bdi>{{ name(row) }}</bdi>
        </button>
      </li>
    }
  </ul>
}
